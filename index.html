<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muve · Conductores</title>
<meta name="description" content="Muve, fletes y mudanzas en Chile. Conductores: cotiza y reserva tu traslado.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #f4f4f4; --card: #ffffff; --text: #0a0a0a; --muted: #6b6b6b; --line: #e2e2e2; }
@media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --card: #151515; --text: #f2f2f2; --muted: #9a9a9a; --line: #2a2a2a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
.logo { display: block; width: 220px; max-width: 70%; margin: 0 auto 6px; background: #fff; border-radius: 18px; padding: 6px 10px; }
h1 { margin: 24px 0 4px; font-size: 1.4rem; letter-spacing: -0.01em; }
p.lead { margin: 0 0 18px; color: var(--muted); }
.driver { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; transition: border-color .15s, transform .15s; }
.driver:hover { border-color: var(--text); transform: translateY(-1px); }
.driver .pic { flex: none; width: 112px; height: 72px; border-radius: 12px; background: radial-gradient(120% 90% at 50% 100%, #2b2b2b, #050505); display: grid; place-items: center; overflow: hidden; }
.driver .pic img { width: 104px; height: auto; }
.driver strong { display: block; font-size: 1.05rem; }
.driver span { display: block; color: var(--muted); font-size: 0.88rem; }
.driver .go { margin-left: auto; flex: none; font-weight: 600; font-size: 0.9rem; padding: 8px 14px; border-radius: 999px; background: var(--text); color: var(--bg); }
footer { margin-top: 36px; text-align: center; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Muve · Fletes y mudanzas · Chile">
  <h1>Conductores</h1>
  <p class="lead">Elige a tu conductor para cotizar y reservar tu traslado.</p>

  <!-- One card per driver: each one is a folder / repo at muveapp.cl/<nombre>. -->
  <a class="driver" href="/leonardomendoza/">
    <div class="pic"><img src="x70.png" alt=""></div>
    <div><strong>Leonardo Mendoza</strong><span>Jetour X70 · hasta 6 pasajeros</span></div>
    <span class="go">Cotizar</span>
  </a>

  <footer>Muve · Fletes y mudanzas · Chile</footer>
</main>
</body>
</html>
